<!doctype html>
<html lang="<!--%LANG%-->">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!--%TITLE%--></title>
    <!--%HEAD%-->
    <link
      rel="alternate"
      type="application/rss+xml"
      title="shxin.blog"
      href="/rss.xml"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <!-- 어느 글에나 나오는 두 몫만 미리 받는다. 한자는 unicode-range가 다른
         두 번째 @font-face가 지고 있어 한자가 실제로 나오는 글에서만
         내려오고, CMU Serif의 굵은·기울인 벌과 라틴 확장도 마찬가지다. -->
    <link
      rel="preload"
      href="/fonts/sm-base.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/cmu-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Runs before first paint so the theme never flashes. Storage access is
      // guarded because private-mode browsers throw on localStorage.
      (() => {
        let saved;
        try {
          saved = localStorage.getItem("paper-blog-theme");
        } catch {
          /* storage unavailable */
        }
        document.documentElement.dataset.theme =
          saved ||
          (matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
      })();
    </script>
    <!--%ASSETS%-->
    <script defer src="/app.js"></script>
  </head>
  <body>
    <main id="app" class="paper"><!--%APP%--></main>
  </body>
</html>
